# Every push to main and every pull request: types and all tests on Windows and Linux,
# then the desktop program driven by real mouse and keyboard input on a virtual display (Linux).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The Python packages of the built-in Python (NumPy), which the checks of the samples import.
      - run: node scripts/pyodide-packages.mjs
      - run: npm run typecheck
      - run: npm test

  smoke:
    name: Smoke test (Linux, real input)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb fonts-dejavu-core
      - run: npm ci --no-audit --no-fund
      - run: node scripts/pyodide-packages.mjs
      # The smoke results (screenshots, result.json) in a folder of their own, kept on a failure.
      - run: |
          mkdir -p "$RUNNER_TEMP/kalketa-smoke"
          echo "TMPDIR=$RUNNER_TEMP/kalketa-smoke" >> "$GITHUB_ENV"
      - run: npm run build:desktop
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/smoke.mjs
      # Screenshots and result.json of the run, to see what went wrong.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/kalketa-smoke
          retention-days: 7
